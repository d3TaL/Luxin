name: Android CI

on:
  push:
    branches:
      - main
      - feat/**
      - android-capture-spike
      - cvautotrack-evaluation
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bigmap-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopencv-dev
      - run: cmake -S tracker -B tracker/build-debug -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build tracker/build-debug --target test_bigmap_session test_bigmap_geometry test_bigmap_motion -j2
      - run: ctest --test-dir tracker/build-debug --output-on-failure -R '^(test_bigmap_session|test_bigmap_geometry|test_bigmap_motion)$'

  build:
    name: Build Debug APK (with Android NDK & OpenCV 4.10)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test and Build Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luxin-capture-spike-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
